name: EventPass CI and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eventpass-classroom
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: eventpass
          MYSQL_USER: eventpass
          MYSQL_PASSWORD: eventpass-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: eventpass
      DB_USER: eventpass
      DB_PASSWORD: eventpass-test-password
      SECRET_KEY: ci-only-key
      ADMIN_PASSWORD: ci-only-organizer-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r app/requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: classroom
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_SECRET_ARN: ${{ vars.DB_SECRET_ARN }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable commit image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --pull -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "uri=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - name: Configure namespace deployment access
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
      - name: Refresh runtime secrets from AWS
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          set -euo pipefail
          db_json="$(aws secretsmanager get-secret-value --secret-id "$DB_SECRET_ARN" --query SecretString --output text)"
          db_user="$(python -c 'import json,sys; print(json.load(sys.stdin)["username"])' <<< "$db_json")"
          db_password="$(python -c 'import json,sys; print(json.load(sys.stdin)["password"])' <<< "$db_json")"
          echo "::add-mask::$db_password"
          kubectl create configmap eventpass-config -n eventpass \
            --from-literal=DB_HOST="$DB_HOST" --from-literal=DB_PORT=3306 \
            --from-literal=DB_NAME="$DB_NAME" --from-literal=DB_USER="$db_user" \
            --dry-run=client -o yaml | kubectl apply --server-side --force-conflicts -f -
          kubectl create secret generic eventpass-db -n eventpass \
            --from-literal=password="$db_password" --dry-run=client -o yaml | kubectl apply --server-side --force-conflicts -f -
          kubectl create secret generic eventpass-app -n eventpass \
            --from-literal=admin-password="$ADMIN_PASSWORD" \
            --from-literal=secret-key="$SECRET_KEY" --dry-run=client -o yaml | kubectl apply --server-side --force-conflicts -f -
      - name: Deploy and wait for the classroom app
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          image_name="${IMAGE_URI%:*}"
          image_tag="${IMAGE_URI##*:}"
          sed -i "s|REPLACE_WITH_ECR_REPOSITORY_URL|$image_name|; s|newTag: classroom|newTag: $image_tag|" k8s/overlays/classroom/kustomization.yaml
          kubectl apply -k k8s/overlays/classroom
          kubectl rollout status deployment/eventpass -n eventpass --timeout=5m
          kubectl get ingress eventpass -n eventpass
